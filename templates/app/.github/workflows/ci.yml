name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  js:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  ps5:
    needs: js
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/adamgoodapp/prosperokit-ps5-builder:v0.42-nightly-2026-10-20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prosperokit build --target ps5
      - uses: actions/upload-artifact@v4
        with:
          name: ps5-package
          path: dist/ps5/*.zip
          if-no-files-found: error
